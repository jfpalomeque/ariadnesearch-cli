[project]
name = "ariadnesearch-cli"
version = "0.1.0"
description = "Prototype for agent-friendly ARIADNE catalogue search"
authors = [{ name = "Juan Palomeque-Gonzalez" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.urls]
"Author website" = "https://jfpalomeque.com"
Repository = "https://github.com/jfpalomeque/ariadnesearch-cli"

[project.scripts]
ariadnesearch = "ariadnesearch.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadnesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
