[project]
name = "archsearch"
version = "0.1.0"
description = "Prototype for agent-friendly ARIADNE catalogue search"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.scripts]
ariadnesearch = "archsearch.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
